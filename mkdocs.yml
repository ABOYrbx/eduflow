site_name: EduFlow
site_description: EduFlow – lokales Schul-Dashboard (Dokumentation)
site_author: EduFlow
site_url: https://aboyrbx.github.io/eduflow/
repo_url: https://github.com/ABOYrbx/eduflow
repo_name: ABOYrbx/eduflow
copyright: EduFlow – lokale Schul-Dashboard-Dokumentation

docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Start: README.md
  - Architektur: ARCHITEKTUR.md
  - Funktionen: FUNKTIONEN.md
  - API v1: API.md
  - Plattformen: PLATTFORMEN.md
  - Entwicklung: ENTWICKLUNG.md
  - Migration: MIGRATION.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
