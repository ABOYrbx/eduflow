org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kein eduflow.defaultBaseUrl mehr: der Server wird in der App als IP
# eingetragen (Onboarding, Login, Einstellungen) und von
# TokenStore.normalizeBaseUrl zu http://<ip>:3000/api/v1/ ergaenzt.
# Ein Default wird nirgends vorbelegt oder angezeigt; die Konstante
# TokenStore.DEFAULT_BASE_URL existiert nur noch als interner Notfallwert,
# falls ohne Eingabe und ohne gespeicherten Server ein Client gebaut wird.
