name: Release

# Erstellt ein signiertes GitHub-Release fuer Android und/oder macOS.
#
# WICHTIG: Dieser Workflow startet NIE automatisch. Es gibt keinen `push`- und
# keinen `tag`-Trigger. Ein Release entsteht ausschliesslich, wenn jemand
# explizit "release 0.1.0" sagt und der Lauf manuell angestossen wird. Das haelt
# die Versionsnummer unter Kontrolle, solange das Projekt frueh ist.
#
# Secrets (Repository -> Settings -> Secrets and variables -> Actions),
# vollstaendig erklaert in .github/RELEASING.md:
#   Android : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   macOS   : keine (ad-hoc signiert, kein Apple-Programm noetig)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne fuehrendes v, z. B. 0.1.0"
        required: true
        type: string
      platform:
        description: "Welche App wird gebaut"
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - macos
      dry_run:
        description: "Nur bauen, kein Release veroeffentlichen"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Als Pre-Release markieren"
        required: false
        default: true
        type: boolean
      notes:
        description: "Release-Notizen (Markdown, optional)"
        required: false
        default: ""
        type: string

# Zwei Laeufe derselben Version hintereinander (z. B. nach einem Abbruch).
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: v${{ inputs.version }}
  # Auch die Version ueber env statt in den run-Text: so wird der Wert nie
  # vom Shell-Parser erneut interpretiert. check-version.sh prueft ohnehin das
  # Format, aber die Verteidigung gehoert in beide Schichten.
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Version und Tag pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      notes: ${{ steps.notes.outputs.text }}
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Versionen pruefen
        run: ./scripts/check-version.sh "${{ inputs.version }}"

      # Ein Tag darf nicht doppelt vergeben werden – sonst waere das
      # veroeffentlichte Release nicht mehr reproduzierbar.
      - name: Tag ist frei
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG existiert bereits. Bitte eine neue Version waehlen."
            exit 1
          fi
          echo "Tag $TAG ist frei."

      # Standard-Notizen nennen den Gatekeeper-Weg: die macOS-App ist
      # ad-hoc signiert, also verlangt der erste Start einen Klick auf
      # "Oeffnen" im Kontextmenue. Ohne diesen Hinweis haelt die App fuer
      # einen Fehler.
      - name: Notizen vorbereiten
        id: notes
        env:
          # Auch hier ueber env: der Notiztext kommt vom Menschen und darf
          # Backticks, $(…) oder Anfuehrungszeichen enthalten, ohne dass die
          # Shell sie interpretiert.
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            printf 'text<<NOTES_EOF\n%s\nNOTES_EOF\n' "$INPUT_NOTES" >> "$GITHUB_OUTPUT"
          else
            printf 'text<<NOTES_EOF\n' >> "$GITHUB_OUTPUT"
            cat >> "$GITHUB_OUTPUT" <<'NOTES_EOF'
          Automatisches Release aus dem Workflow `release.yml`.

          ### macOS: erster Start

          Die App ist ad-hoc signiert, also **nicht** von Apple notarisiert.
          Beim ersten Öffnen blockiert Gatekeeper den Start. Einmalig:

          1. DMG öffnen und `EduFlow.app` nach „Programme" ziehen
          2. `EduFlow` in „Programme" **rechts anklicken** → **Öffnen** → **Öffnen**

          Ab dann startet die App normal. Es ist kein Apple-Developer-Account
          nötig; nur macOS/Xcode bzw. die Command-Line-Tools zum Bauen.
          NOTES_EOF
            printf 'NOTES_EOF\n' >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android (signierte universelle APK)
    needs: verify
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Die Runner bringen Android-SDK, platform-tools und die passenden
      # build-tools bereits mit. setup-android wird deshalb gar nicht
      # benoetigt: ohne eigene Pins versucht die Action, eine Preview-Version
      # der Command-Line-Tools nachzuladen, und scheitert an deren Lizenz.
      # Wichtig: sdkmanager liegt im Image NICHT im PATH, der Pfad muss
      # selbst gesetzt werden, sonst endet der Schritt mit exit 127.
      - name: Android SDK pruefen
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
            "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
            "$ANDROID_HOME"/tools/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager
          do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          [ -n "$SDKMANAGER" ] || {
            echo "::error::sdkmanager nicht gefunden. Kandidaten:"
            ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null || true
            exit 1
          }
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/build-tools"

      # Der Keystore kommt als base64-Secret und wird nur im Runner-Memory
      # materialisiert. Er wird nirgends geschrieben oder geloggt.
      - name: Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          # PKCS12 kennt kein getrenntes Key-Passwort, keytool ignoriert
          # -keypass. Darum nur ein Passwort-Secret (siehe build.gradle.kts).
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name fehlt. Siehe .github/RELEASING.md"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "EDUFLOW_KEYSTORE_PATH=$KEYSTORE"
            echo "EDUFLOW_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "EDUFLOW_KEY_ALIAS=$KEY_ALIAS"
            # fuer JKS vorbereitet; bei PKCS12 harmlos, weil Gradle den Wert
            # nur nutzt, wenn ein Key-Passwort noetig ist.
            echo "EDUFLOW_KEY_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      # -PeduflowRequireReleaseSigning=true: bricht ab, falls die
      # Keystore-Umgebung nicht angekommen ist, statt still einen
      # debug-signierten APK zu veroeffentlichen.
      - name: Release-APK bauen
        run: |
          ./gradlew :app:assembleRelease \
            --console=plain \
            -PeduflowRequireReleaseSigning=true \
            -PeduflowVersionName="${{ inputs.version }}" \
            -PeduflowVersionCode=1
        working-directory: android

      - name: Signatur pruefen
        run: |
          set -eu
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::Keine APK im Release-Output."; exit 1; }
          echo "APK: $APK"
          # Neueste installierte build-tools nehmen, nicht auf eine feste
          # Version bauen – der Runner liefert sie bereits mit.
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner fehlt: $APKSIGNER"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --verbose "$APK" | grep -i "v2 scheme\|v3 scheme" | head -4 || true

      - name: APK umbenennen und hochladen
        uses: actions/upload-artifact@v4
        with:
          name: eduflow-android-${{ inputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  macos:
    name: macOS (ad-hoc signiert, DMG + ZIP)
    needs: verify
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    # Aktuelles Xcode noetig: der Code nutzt APIs aus dem macOS-15-SDK
    # (onScrollGeometryChange) und strengere Swift-6-Concurrency-Pruefungen.
    # Auf macos-14 (Xcode 15.4) bricht der Release-Build ab, waehrend lokal
    # alles gruen ist; 'latest' traegt den passenden Xcode automatisch nach.
    runs-on: macos-latest
    timeout-minutes: 60
    # Bewusst ohne Apple-Programm: kein Developer-ID-Zertifikat, keine
    # Notarisierung. Die App wird ad-hoc signiert (CODE_SIGN_IDENTITY = "-"),
    # exakt wie im Projekt hinterlegt. Gatekeeper verlangt dann beim ersten
    # Start ein "Oeffnen" im Kontextmenue – der Hinweis steht in den
    # Release-Notizen, siehe .github/RELEASING.md.
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      # Der Pfad zur .app wird von Xcode aufgeloest, nicht geraten: bei
      # -derivedDataPath landen die Produkte in <pfad>/Build/Products/<config>/
      # und der Produktname folgt aus dem Target ("EduFlow"), nicht aus dem
      # Scheme ("EduFlow Mac"). Ein hart gecodeter Pfad lag daneben.
      - name: Release-Build (ad-hoc signiert)
        run: |
          set -eu
          DD="$RUNNER_TEMP/Build"
          SETTINGS=$(xcodebuild -project "mac/EduFlow Mac.xcodeproj" \
            -scheme "EduFlow Mac" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DD" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            -showBuildSettings)
          PRODUCTS=$(printf '%s\n' "$SETTINGS" | sed -n 's/^ *BUILT_PRODUCTS_DIR = //p' | head -1)
          FULLNAME=$(printf '%s\n' "$SETTINGS" | sed -n 's/^ *FULL_PRODUCT_NAME = //p' | head -1)
          [ -n "$PRODUCTS" ] && [ -n "$FULLNAME" ] || {
            echo "::error::BUILT_PRODUCTS_DIR oder FULL_PRODUCT_NAME nicht gefunden"
            printf '%s\n' "$SETTINGS" | head -40
            exit 1
          }
          APP="$PRODUCTS/$FULLNAME"
          echo "App-Pfad: $APP"

          # Ohne arch-Angabe bestimmt das Toolchain die Architektur; eine
          # feste Angabe erzeugte auf dem arm64-Runner ein leeres .app.
          xcodebuild build \
            -project "mac/EduFlow Mac.xcodeproj" \
            -scheme "EduFlow Mac" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DD" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
          [ -d "$APP" ] || {
            echo "::error::App fehlt unter $APP. Vorhandene Produkte:"
            find "$PRODUCTS" -maxdepth 1 -name '*.app' || true
            exit 1
          }
          # Ad-hoc ist eine echte Signatur, aber keine Vertrauenssignatur –
          # die Pruefung darf hier nicht fehlschlagen.
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | sed -n '1,12p'
          # Die gebaute Version muss der Tag-Version entsprechen.
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: DMG und ZIP bauen
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # diskutil statt hdiutil create: Letzteres ist deprecated und
          # warnt auf neuen Runnern. Das Ergebnis ist ein UDZO-komprimiertes
          # Image mit gesetztem Volumennamen.
          diskutil image create from "$STAGE" \
            --volumeName "EduFlow ${{ inputs.version }}" \
            -format UDZO \
            "$RUNNER_TEMP/EduFlow-${{ inputs.version }}.dmg"
          # ditto statt zip: nur ditto bewahrt die Code-Signatur im Archiv.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "$RUNNER_TEMP/EduFlow-${{ inputs.version }}.zip"
          hdiutil verify "$RUNNER_TEMP/EduFlow-${{ inputs.version }}.dmg"

      - name: DMG und ZIP hochladen
        uses: actions/upload-artifact@v4
        with:
          name: eduflow-macos-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/EduFlow-${{ inputs.version }}.dmg
            ${{ runner.temp }}/EduFlow-${{ inputs.version }}.zip
          if-no-files-found: error

  release:
    name: GitHub-Release veroeffentlichen
    needs: [verify, android, macos]
    # Wenn eine Plattform uebersprungen wurde (platform-Eingabe), faellt der
    # Job normal durch – deshalb hier bewusst nicht 'if: always()'.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          pattern: "eduflow-*${{ inputs.version }}"
          path: dist
          merge-multiple: true

      - name: Inhalt zeigen
        run: ls -lh dist

      # WICHTIG: Die Notizen kommen ueber env, nicht direkt in den run-Text.
          # Ein ${{ … }} im Skript wird vom Text ersetzt – und der Notiztext
          # enthaelt Backticks (`` `release.yml` ``) sowie Umlaute. Im
          # Skript fuehrt die Shell die Backticks als Befehl aus, Umlaute in
          # Anfuehrungszeichen loesen Globbing aus. In einer env-Variablen
          # wird der Wert nie erneut geparst.
      - name: Release veroeffentlichen
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.verify.outputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "EduFlow $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $PRERELEASE_FLAG \
            dist/*

      - name: Dry-Run bestaetigen
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry-Run: Artefakte liegen in dist/ und wurden NICHT veroeffentlicht."
          echo "Tag $TAG existiert bewusst noch nicht."