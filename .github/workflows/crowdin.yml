# Crowdin-Sync (Quellen-Upload; siehe plaene/LOKALISIERUNG.md)
#
# - Push auf main lädt geänderte Quellen hoch (Deutsch ist Source + Fallback).
# - Übersetzungs-PRs erstellt die Crowdin-GitHub-App per Sync-Schedule
#   (der download-Job wurde entfernt, damit nicht zwei Bots konkurrieren).
# Benötigte GitHub-Secrets: CROWDIN_PROJECT_ID, CROWDIN_TOKEN.

name: Crowdin Sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/messages/de.json'
      - 'apps/api/src/messages/de.json'
      - 'android/app/src/main/res/values/strings.xml'
      - 'mac/EduFlow/Resources/Localizable.xcstrings'
      - 'crowdin.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  upload-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellen nach Crowdin hochladen
        uses: crowdin/crowdin-github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
