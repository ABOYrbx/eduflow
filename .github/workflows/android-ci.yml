name: Android CI

# Baut die Android-App und laesst die Offline-Unit-Tests laufen. Ohne Secrets
# nutzbar – der Release-Workflow hat eine eigene, signierte Pipeline.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "VERSION"
      - "scripts/check-version.sh"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "VERSION"
      - "scripts/check-version.sh"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug-Build und Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      # compileOptions/kotlinOptions stehen auf JVM 17 (android/app/build.gradle.kts).
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: android-gradle-${{ runner.os }}-${{ hashFiles("android/gradle/wrapper/gradle-wrapper.properties", "android/**/*.kts") }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: Versionen pruefen
        run: ./scripts/check-version.sh

      # Nur Offline-Tests: Fake-ApiService, keine echten Zugangsdaten.
      - name: Debug-Build und Unit-Tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
        working-directory: android

      - name: Debug-APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: eduflow-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn