# EduFlow – Crowdin-Quellen (Source-Sprache: Englisch)
#
# Die Crowdin-GitHub-App nutzt diese Datei. Secrets (CROWDIN_PROJECT_ID,
# CROWDIN_TOKEN) liegen nur als GitHub-Secrets, niemals im Repo
# (siehe plaene/LOKALISIERUNG.md).
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_TOKEN
preserve_hierarchy: true

files:
  # Web (Next.js, Quelle = englisch, `t()` aus apps/web/src/lib/i18n.ts).
  # Übersetzungen landen als weitere Kataloge neben en.json (inkl. de.json).
  - source: /apps/web/messages/en.json
    translation: /apps/web/messages/%two_letters_code%.json
    update_option: update_as_unapproved

  # Backend (NestJS-Fehlermeldungen + Settings-Schema + API-Docs, `t()` aus
  # apps/api/src/i18n.ts). API-Fehler-`code`s werden nie übersetzt.
  - source: /apps/api/src/messages/en.json
    translation: /apps/api/src/messages/%two_letters_code%.json
    update_option: update_as_unapproved

  # Android (Quelle = englisch in values/ — globaler Fallback; Deutsch liegt
  # in values-de/, Texte via stringResource)
  - source: /android/app/src/main/res/values/strings.xml
    translation: /android/app/src/main/res/values-%android_code%/strings.xml
    update_option: update_as_unapproved

  # macOS String Catalog (alle Sprachen leben in derselben Datei;
  # multilingual befreit vom Sprach-Platzhalter, siehe CLI-Doku).
  # Source-Sprache steht in der Datei (`sourceLanguage: en`).
  - source: /mac/EduFlow/Resources/Localizable.xcstrings
    translation: /mac/EduFlow/Resources/Localizable.xcstrings
    multilingual: true
