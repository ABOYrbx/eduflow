# Gettext-Quellen für Crowdin (Deutsch bleibt Source und Fallback).
# Erzeugen: pybabel extract -F babel.cfg -o locales/templates/messages.pot .

[extractors]
eduflow_html = localization:extract_template_messages

[python: **.py]
keywords = gettext ngettext:1,2 pgettext:1c,2 npgettext:1c,2,3 _ translate_static localize_api_error flash:1 api_error:1
encoding = utf-8

[eduflow_html: **/templates/**.html]
extensions = jinja2.ext.i18n
encoding = utf-8
