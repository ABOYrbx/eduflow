<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduFlow 2FA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='uber.css') }}">
<script>try{var t=localStorage.getItem("theme");if(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches){t="dark";}if(t){document.documentElement.dataset.theme=t;}var a=localStorage.getItem("accent");if(a){document.documentElement.dataset.accent=a;}}catch(e){}</script>
<script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body>
<button class="theme-toggle auth-top-right" type="button" aria-label="Farbschema wechseln">☾</button>
<div class="auth-wrap">
  <div class="auth-card anim-in">
    <div class="brand"><span class="brand-mark">E</span></div>
    <h1>Zwei-Faktor-Code</h1>
    <p class="sub">EduFlow erfordert 2FA. Gib den Code aus deiner E-Mail / App ein.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="notice">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="code">Code</label>
      <input class="input-pill" id="code" name="code" placeholder="2FA-Code" required autocomplete="one-time-code">
      <button class="btn btn-primary" type="submit">Bestätigen</button>
    </form>
  </div>
</div>
</body>
</html>
