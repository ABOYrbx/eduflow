<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduFlow Anmeldung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='uber.css') }}">
<script>try{var t=localStorage.getItem("theme");if(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches){t="dark";}if(t){document.documentElement.dataset.theme=t;}var a=localStorage.getItem("accent");if(a){document.documentElement.dataset.accent=a;}}catch(e){}</script>
<script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body>
<button class="theme-toggle auth-top-right" type="button" aria-label="Farbschema wechseln">☾</button>
<main class="auth-wrap auth-welcome">
  <div class="auth-particles" aria-hidden="true"></div>
  <section class="auth-layout anim-in">
    <div class="auth-intro">
      <div class="auth-logo-stage">
        <img class="auth-logo" src="{{ url_for('static', filename='icons/icon.png') }}" alt="EduFlow">
        <span class="auth-orbit auth-orbit-one"></span><span class="auth-orbit auth-orbit-two"></span>
      </div>
    </div>
    <div class="auth-card">
    <h2>Bei EduFlow anmelden</h2>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="notice">{{ msg }}</div>
    {% endfor %}
    {% endwith %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="subdomain">Schul-Subdomain</label>
      <input class="input-pill" id="subdomain" name="subdomain" placeholder="z. B. myschule" autocomplete="username">
      <label for="username">Benutzername</label>
      <input class="input-pill" id="username" name="username" required autocomplete="username">
      <label for="password">Passwort</label>
      <input class="input-pill" id="password" name="password" type="password" required autocomplete="current-password">
      <label class="check" style="margin-top:14px"><input type="checkbox" name="remember" value="1" checked> Angemeldet bleiben (30 Tage)</label>
      <button class="btn btn-primary" type="submit">Anmelden</button>
    </form>
    <p class="hint">Subdomain leer lassen für Auto-Erkennung über <code>portal.edupage.org</code>.</p>
    </div>
  </section>
</main>
</body>
</html>
